services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_HOST=http://ollama:11434
      # Prefer a dedicated ZAP daemon service over Docker socket access in app containers.
      - ZAP_BASE_URL=http://zap:8080
    depends_on:
      - redis
      - ollama
      - zap

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  celery_worker:
    build: ./backend
    command: celery -A src.workers worker --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ZAP_BASE_URL=http://zap:8080
    depends_on:
      - redis
      - backend
      - zap

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    restart: unless-stopped
    environment:
      - JAVA_OPTS=-Xms256m -Xmx768m
    # Long-lived daemon consumed by backend via ZAP_BASE_URL.
    command:
      - zap.sh
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8080"
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
      - -config
      - api.disablekey=true

volumes:
  ollama_data:
